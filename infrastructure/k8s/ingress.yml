apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shadowsig-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - shadowsig.local
    - api.shadowsig.local
    secretName: shadowsig-tls
  rules:
  - host: shadowsig.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: shadowsig-web-svc
            port:
              number: 80
  - host: api.shadowsig.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: shadowsig-api-svc
            port:
              number: 8080
