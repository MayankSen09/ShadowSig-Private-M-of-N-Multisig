name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Frontend
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run lint
      - run: bun run build

  # Backend
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
      DATABASE_URL: "postgres://shadowsig:shadowsig@localhost:5432/shadowsig"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/api -> target"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -W clippy::all
      - run: cargo build --release
      - run: cargo test

  # Docker Build & Deploy
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          file: infrastructure/docker/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/shadowsig-api:latest
            ghcr.io/${{ github.repository }}/shadowsig-api:${{ github.sha }}
            
      - name: Build and push Web
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          file: infrastructure/docker/Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/shadowsig-web:latest
            ghcr.io/${{ github.repository }}/shadowsig-web:${{ github.sha }}
